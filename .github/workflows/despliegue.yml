name: Despliegue

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Definir nombre de la imagen
        id: meta
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir y publicar la imagen
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${{ steps.meta.outputs.imagen }} .
          docker push ${{ steps.meta.outputs.imagen }}

  desplegar:
    name: Desplegar con Docker Compose
    runs-on: ubuntu-latest
    needs: publicar
    environment: produccion
    env:
      API_IMAGE: ${{ needs.publicar.outputs.imagen }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Descargar la imagen publicada y desplegar
        run: |
          docker compose pull api
          docker compose up -d --no-build

      - name: Prueba de humo
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8080/health; then
              echo
              echo "Despliegue sano"
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verificar trazabilidad
        run: |
          docker compose ps
          REV=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$API_IMAGE")
          echo "Imagen desplegada: $API_IMAGE"
          echo "Commit de origen:  $REV"
          echo "### Despliegue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`$API_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$REV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar el entorno simulado
        if: always()
        run: docker compose down

  kubernetes:
    name: Desplegar en Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: publicar
    env:
      IMAGEN: ${{ needs.publicar.outputs.imagen }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Crear cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: tareas

      - name: Instalar Prometheus y Grafana (kube-prometheus-stack)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set alertmanager.enabled=false \
            --set grafana.adminPassword=admin \
            --wait --timeout 8m

      - name: Cargar la imagen publicada en el cluster
        run: |
          docker pull "$IMAGEN"
          kind load docker-image "$IMAGEN" --name tareas

      - name: Aplicar manifiestos con la imagen del commit
        run: |
          sed "s|image: tareas-api:local|image: $IMAGEN|" k8s/api.yaml | kubectl apply -f -
          kubectl -n tareas rollout status deployment/tareas-api --timeout=120s

      - name: Registrar la API en Prometheus (ServiceMonitor)
        run: kubectl apply -f k8s/servicemonitor.yaml

      - name: Prueba de humo en el cluster
        run: |
          kubectl -n tareas port-forward svc/tareas-api 8081:80 &
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8081/health; then
              echo
              kubectl -n tareas get deploy,pods -o wide
              exit 0
            fi
            sleep 2
          done
          kubectl -n tareas describe pods
          exit 1

      - name: Verificar que Prometheus recolecta la API
        run: |
          kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 &
          kubectl -n tareas port-forward svc/tareas-api 8082:80 &
          sleep 5
          for i in $(seq 1 10); do curl -s http://localhost:8082/tareas > /dev/null; done
          for i in $(seq 1 30); do
            N=$(curl -sG http://localhost:9090/api/v1/query \
                  --data-urlencode 'query=sum(up{namespace="tareas"})' \
                | python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)")
            if [ "$N" -ge 1 ]; then
              echo "Prometheus ve $N pods de la API"
              exit 0
            fi
            sleep 5
          done
          echo "Prometheus no esta recolectando la API"
          exit 1

      - name: Cargar el dashboard en Grafana
        run: |
          kubectl -n monitoring create configmap dashboard-devops --from-file=dashboards/grafana-dashboard-devops.json
          kubectl -n monitoring label configmap dashboard-devops grafana_dashboard=1