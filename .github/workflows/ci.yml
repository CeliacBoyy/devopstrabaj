name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Politica de calidad: el pipeline falla si la cobertura baja del 80 %
      - name: Ejecutar pruebas con cobertura minima
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  imagen:
    name: Construir, escanear y probar la imagen
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t tareas-api:${{ github.sha }} .

      # Bloqueo de seguridad: falla si hay vulnerabilidades altas o criticas con arreglo disponible
      - name: Escanear la imagen con Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            tareas-api:${{ github.sha }}

      - name: Levantar contenedor y probar /health
        run: |
          docker run -d --name api -p 8000:8000 tareas-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo
              echo "Contenedor sano"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1