name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Política de calidad: el pipeline falla si la cobertura baja del 80 %
      - name: Ejecutar pruebas con cobertura mínima
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  imagen:
    name: Construir, escanear y probar la imagen
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t tareas-api:${{ github.sha }} .

      # Bloqueo de seguridad: falla si hay vulnerabilidades altas o críticas con arreglo disponible
      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tareas-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Levantar contenedor y probar /health
        run: |
          docker run -d --name api -p 8000:8000 tareas-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo
              echo "Contenedor sano"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1