services:
  api:
    build: .
    image: ${API_IMAGE:-tareas-api:local}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Parámetros de escalabilidad: tope de recursos por contenedor
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    # Parámetros de seguridad: contenedor endurecido
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy